    - discriminant: mediaText
      value:
        navLabel: Context
        label: Context
        heading: Turning an overlooked edge of the Green into a destination.
        intro: ''
        body: |-
          I spent this past summer at Gensler's Morristown, New Jersey location. Our project site sat right next door, on the corner of the Morristown Green, a place rich in history and culture.

          Our client, SJP Properties, asked us to design a mixed-use development concept with ground-floor retail and residential units above. Over 9 weeks, five interns from architecture, interiors, and design strategy took the project from research to final renderings.
        roleLabel: My Role
        role: As the Design Strategist, I turned community insights and market research into the framework and story that shaped our designs.
        image: /images/projects/gensler/context-map.jpg
        imageLeft: true
        bigImage: true
    - discriminant: callout
      value:
        label: Why?
        serif: false
        text: Why is **facilitating belonging** in a place important, and how might we **create** it?
    - discriminant: circles
      value:
        navLabel: Site
        label: Site
        heading: A prominent corner that people walk past instead of to.
        circles:
          - image: /images/projects/gensler/site-retail.jpg
            label: Retail spaces
          - image: /images/projects/gensler/site-residential.jpg
            label: Residential spaces
          - image: /images/projects/gensler/site-dining.jpg
            label: Dining spaces
        body: |-
          The site anchors a corner of the Morristown Green, fronting North Park Place and Washington Street next to Gensler's own office, with about 23 feet of elevation change across the lot.

          Historically, this corner was a place of arrival, gathering and everyday exchange. Mapping today's **retail**, **residential** and **dining** uses showed the opposite: North Park Place is noticeably quieter than the other edges of the Green.
