caseStudy:
  enabled: true
  accent: '#ee3224'
  tint: '#f8d2cf'
  hero: /images/projects/gensler/hero.jpg
  headline: 'The Mews at North Park: Designing for Belonging'
  summary: >-
    For the 2026 Gensler Morristown intern project, our team designed a
    mixed-use development for SJP Properties on a quiet corner of the
    Morristown Green. We started from one question, "What does belonging mean
    to you?", and let community research shape everything from the program to
    the brand.
  role: Design Strategist
  team: |-
    2 Architects
    1 Interior Designer
    2 Design Strategists
  timeline: 9 weeks, Summer 2026
  skills: |-
    Communications Research
    Data Visualization
    Programming & Strategy
