    - discriminant: cards
      value:
        navLabel: Principles
        label: Principles of Belonging
        heading: Three reasons to come, to stay, and to belong.
        narrowIntro: true
        intro: We turned the history, site analysis and survey into three principles. Each one draws its color from a piece of Morristown, and became the lens for every design decision after it.
        tinted: false
        cards:
          - image: /images/projects/gensler/gather.jpg
            title: Gather, reasons to come.
            text: Unique retail, dining, everyday conveniences and active storefronts turn the corner into a destination. Its red comes from Morristown's historic brick streets.
          - image: /images/projects/gensler/dwell.jpg
            title: Dwell, reasons to stay.
            text: Outdoor space, wellness amenities and comfortable places help people build routines and a sense of home. Its blue comes from the Whippany River, where Morristown was first settled.
          - image: /images/projects/gensler/connect.jpg
            title: Connect, reasons to belong.
            text: Community programming and shared public space strengthen ties between residents, workers and visitors. Its green comes from the Green itself, the town's heart for over 300 years.
    - discriminant: cards
      value:
        navLabel: Design
        label: Design
        heading: From what people asked for to a building around a courtyard.
        narrowIntro: true
        intro: We turned the history, site analysis and survey into three principles. Each one draws its color from a piece of Morristown, and became the lens for every design decision after it.
        tinted: false
        cards:
          - image: null
            video: /images/projects/gensler/programming-venn.mp4
            title: Programming straight from the survey.
            text: We sorted every requested use, from grocery and pharmacy to a beer hall and speakeasy, under Gather, Dwell and Connect. That bubble diagram became the retail floor plan, with an outdoor court at its center.
          - image: null
            video: /images/projects/gensler/massing-process.mp4
            title: Massing that opens up the block.
            text: The mass was carved step by step, cutting a path through the site to keep the garage-to-Green connection. The courtyard it opens gives the ground floor 5.6x more storefront frontage than it would have without it.
    - discriminant: steps
      value:
        navLabel: Branding
        label: Branding
        heading: Naming The Mews at North Park.
        steps:
          - image: /images/projects/gensler/mews.jpg
            label: 'Step 1: Traditional definition'
            title: mews
            subtitle: /myo͞oz/
            body: A mews is a row or courtyard of stables and carriage houses with living quarters above them. Today, these former stables have largely been converted into highly desirable, charming residential homes.
            detailImage: /images/projects/gensler/historic-map.jpg
            detailCaption: Hotel stables found right between the Century21 and our lots on historic site map from 1885
          - image: /images/projects/gensler/mews-redefined.jpg
            label: 'Step 2: Our definition'
            title: mews *(redefined)*
            titleImage: null
            subtitle: /myo͞oz/
            body: A mews is a row or courtyard of **retail spaces and community spaces** with living quarters above them. Today, these ground-floor spaces serve as an **active destinations that bring people together**, creating highly desirable, charming residential homes.
            detailImage: null
            detailCaption: ''
          - image: /images/projects/gensler/mews-courtyard.jpg
            label: 'Step 3: Adding the identity'
            title: The Mews at North Park
            titleImage: /images/projects/gensler/mews-logo.png
            subtitle: ''
            body: |-
              The mews provides the idea.
              **North Park provides the identity.**

              By pairing the name with its location and drawing from the character of downtown Morristown, the brand becomes uniquely tied to the neighborhood it serves.
            detailImage: null
            detailCaption: ''
    - discriminant: cards
      value:
        navLabel: Outcome
        label: Outcome
        heading: Belonging is something you can design for, if you ask questions first.
        intro: We turned the history, site analysis and survey into three principles. Each one draws its color from a piece of Morristown, and became the lens for every design decision after it.
        tinted: true
        cards:
          - image: null
            title: Research can drive the floor plan.
            text: Every design decision traces back to something people told us in the survey, which made our design decisions easy to defend in front of the client.
          - image: null
            title: A shared framework helps a mixed team.
            text: Gather, Dwell and Connect gave architects, interior designers and strategists a common language, from early bubble diagrams to the final interiors.
          - image: null
            title: Strategy carries all the way to the brand.
            text: The same principles shaped the name, the colors and the story we told, so the presentation felt like one connected idea.
