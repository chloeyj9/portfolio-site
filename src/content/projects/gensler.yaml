            highlightLabel: 'Identified Retail Gaps:'
            highlight: Apparel (19 Responses), Grocery/Convenience Store (19 Responses), Pharmacy (14 Responses)
            note: Survey responses suggest that people are seeking more reasons to visit downtown Morristown. Retail, dining, and convenience offerings emerged as the strongest opportunities to increase activity and strengthen North Park Place as a destination.
