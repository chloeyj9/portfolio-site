  hero: /images/projects/hours-observed/hero.jpg
  headline: 9 to 5, as an algorithm sees it
  summary: >-
    An exploration of what AI looks like with a physical form: a friendly-looking
    desk punch clock that uses facial tracking to decide whether your time
    "counts." It turns a quiet trend in workplace tools, judging people by how
    busy they look, into an object you can see and touch.
