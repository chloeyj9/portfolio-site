        serif: false
        text: How might we turn the clinic into a place that connects members to the support they need to stay healthy, before they get sick?
    - discriminant: text
      value:
        navLabel: Outcome
        label: Outcome
        heading: In healthcare, a good design has to work for the patient, the clinician and the budget.
        body: |-
          **Design for every customer in the room.**
          Members, healthcare workers and administrators each needed something different from the same space. The strongest ideas were the ones that solved for all three at once, not just the patient.

          **A design isn't done until it has a business case.**
          Working alongside an MBA teammate, I learned to frame design decisions in terms of cost, return and scale. That made our ideas something a health system could actually say yes to.

          **Designers can be the translator on a mixed team.**
          With engineering, public health and business backgrounds on the team, visuals like journey maps and renderings became our shared language. Turning research into something everyone could see helped us agree faster.

          **A physical space is part of the product.**
          The clinic lobby turned out to be one of the most valuable touchpoints in the whole patient experience. Designing it as a service, not just a room, changed how I think about where products live.
        wide: true
