        label: Overview
        heading: Helping Kaiser Permanente meet members' needs beyond the exam room.
        body: Outpatient care is growing fast, and many patients arrive at the clinic carrying needs that medicine alone can't solve. Our multidisciplinary team partnered with Kaiser Permanente to explore how clinics could support members' everyday health, not just their appointments. We ran customer discovery across members, healthcare workers and administrators, then proposed a strategy spanning physical space, technology and clinical workflow, backed by a business case.
