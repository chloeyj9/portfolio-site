heading: Hi! I’m Chloe — I design to answer questions and tell people’s stories.
body: |-
  Ever since I was a kid, I remember asking “why?”, even about the most mundane things. Discovering the background behind the things we see every day and digging to the root of problems inspires me to design with purpose. I find it remarkable how even the simplest patterns have a story behind why they are the way they are.

  Exploring art in many different mediums has let me express myself, my story, and the movements I’ve always been passionate about. Through strategic design, I’ve learned I can do the same at a larger scale: for communities, and especially for the voices that aren’t always heard.

  Previously, I worked at Gensler, investigating client insights to guide design recommendations. I specialize in user research and strategy, and I thrive on compassionate, collaborative teams that create impact.
